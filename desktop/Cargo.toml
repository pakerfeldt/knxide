[package]
name = "knxide-desktop"
description = "The knxide programmer as a desktop application: the page in a window of its own."
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pakerfeldt/knxide"
publish = false

# Not part of the main workspace: the window brings the system's web view and its toolkit
# with it (GTK and WebKitGTK on Linux), which the library crates and their checks stay free of.
[workspace]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
knxide-programmer = { path = "../apps/knxide-programmer" }
tauri = { version = "2", default-features = false, features = ["wry", "x11", "dbus", "common-controls-v6"] }
# The system's own file chooser (through the desktop portal) in place of GTK's, which
# compositors do not know for a dialog of the window; messages then come from zenity.
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["net", "rt-multi-thread"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[build-dependencies]
tauri-build = "2"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
strip = true
