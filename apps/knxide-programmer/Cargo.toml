[package]
name = "knxide-programmer"
description = "Web page that downloads KNX application programs to devices from an ETS project export."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["knx", "ets", "home-automation", "device-programming", "web"]
categories = ["network-programming", "command-line-utilities", "hardware-support"]
# Experimental, like the planner crate it is built on.
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "query"] }
knxide-core.workspace = true
knxide-ip.workspace = true
knxide-program = { path = "../../crates/knxide-program" }
knxide-tokio.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { workspace = true, features = ["rt-multi-thread", "signal"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
knxide-testkit.workspace = true
tokio-tungstenite = "0.30"

[lints]
workspace = true
