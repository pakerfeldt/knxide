[package]
name = "knxide-mcp"
description = "MCP server for a KNX bus: lets AI assistants look up, read and (optionally) write group addresses."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["knx", "knxnet-ip", "home-automation", "mcp", "ai"]
categories = ["network-programming", "command-line-utilities", "hardware-support"]
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
knxide-core.workspace = true
knxide-ip.workspace = true
knxide-project.workspace = true
knxide-tokio.workspace = true
serde_json = "1"
tokio = { workspace = true, features = ["rt-multi-thread", "io-std", "signal"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[dev-dependencies]
knxide-testkit.workspace = true

[lints]
workspace = true
