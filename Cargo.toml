[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Latest stable at M0 (1.99) minus three releases. Raise deliberately, never as a side effect.
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pakerfeldt/knxide"
readme = "README.md"

[workspace.dependencies]
knxide-core = { path = "crates/knxide-core", version = "0.1.0" }
knxide-ip = { path = "crates/knxide-ip", version = "0.1.0" }
knxide-tokio = { path = "crates/knxide-tokio", version = "0.1.0" }
knxide-project = { path = "crates/knxide-project", version = "0.1.0" }
knxide-testkit = { path = "crates/knxide-testkit" }

proptest = "1"
# Already in the tree through tokio; used directly for multicast socket options.
socket2 = "0.6"
thiserror = "2"
tokio = { version = "1", features = ["net", "time", "sync", "rt", "macros", "io-util"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
